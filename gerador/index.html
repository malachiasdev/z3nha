<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Z3NHA</title>
    <meta name="keyword" content="Gerador de senhas =, gerador password">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1 class="logo">Z3NHA</h1>
    <main class="container-input">
        <span>Tamanho: <span id="valor"></span> caracteres</span>
        <input id="slider" class="slider" type="range" min="5" max="30" value="15"/>
        <button id="button" class="button-cta" onclick="generatePassword()">Gerar senha</button>
    </main>
    <div id="container-password" class="container-password hide">
        <span>Sua senha gerada foi:</span>
        <span id="password" class="password"></span>
        <button class="tooltip" onclick="copyPassword()">Clique aqui para copiar.</button>
    </div>
    <script src="script.js"></script>
</body>
</html>
